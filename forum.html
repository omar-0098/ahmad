*{box-sizing:border-box;margin:0}
body{font-family:'Cairo',sans-serif;background:var(--paper);color:var(--ink);line-height:1.6}
a{color:inherit;text-decoration:none}

.counts{display:flex;gap:18px;flex-wrap:wrap;margin-top:6px;font-size:.9rem;color:var(--muted)}.counts b{color:var(--navy);font-size:1rem}
.btn{font:inherit;font-weight:600;border:0;border-radius:6px;padding:4px 33px;cursor:pointer;background:var(--navy);color:#fff}
.btn:hover{background:#2B3A7A}

.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}.btn.ghost:hover{background:var(--paper)}
.btn.red{background:#fff;color:var(--red);border:1px solid var(--red)}.btn.red:hover{background:#FCEFEE}
.btn:disabled{opacity:.5;cursor:default}
.small{font-size:11px;padding:4px 12px}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}.bar input{flex:1;min-width:200px}
input,textarea,select{font:inherit;width:100%;padding:9px 12px;border:1px solid #BFCAD9;border-radius:6px;background:#fff;color:var(--ink)}
textarea{min-height:90px;resize:vertical}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:14px}
.tab{white-space:nowrap;border:0;border-bottom:3px solid transparent;font:inherit;font-weight:600;padding:8px 14px;background:none;color:var(--muted);cursor:pointer}
.tab.on{color:var(--navy);border-bottom-color:var(--navy)}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:50px;cursor:pointer;min-width:0;gap: 0px;}
.card:hover{border-color:var(--navy)}
.card.pin{border-inline-start:4px solid var(--amber)}
.who{display:flex;align-items:center;border-radius: 6px 6px 0px 0px;gap:10px;background: #5eb8ff;padding: 3px 8px;}.who small{display:block;color:var(--muted);font-size:.78rem}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:none;align-items: start;background:var(--navy)!important}
.st{margin-inline-start:auto;font-size:.8rem;font-weight:700}
.st.ok{color:var(--ok)}.st.wait{color:#9A6400}.st.done{color:var(--muted)}
.card h3{font-size:1.05rem;margin:0px 0 2px;background: #5eb8ff;padding: 3px 8px;border-radius: 0px 0px 6px 6px}

.body,.trb,.card p,.card h3,.box h2,.who b,.sim a,.chip,.reply{overflow-wrap:anywhere;word-break:break-word}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.82rem;color:var(--muted)}
.chip{background:var(--mist);color:var(--navy);border-radius:4px;padding:1px 8px;font-weight:600;font-size:.8rem;max-width:100%}
.chip.pin{background:var(--amber);color:var(--ink)}.chip.ok{background:#DDF3E7;color:var(--ok)}.chip.hot{background:#FBE3DF;color:var(--red)}
.thumb{width:100%;max-height:240px;object-fit:cover;border-radius:6px;margin-top:10px;display:block}
.vl{font-size:.8rem;font-weight:700;color:var(--muted);margin-top:10px}

.trw{color:var(--muted);font-size:.88rem}
.foot{margin-top:10px;padding-top:8px;border-top:1px solid var(--mist)}

.empty,.state{text-align:center;color:var(--muted);padding:40px 10px}
.ov{position:fixed;inset:0;background:rgba(20,27,61,.6);display:none;z-index:50;overflow:auto;padding:20px}
.ov.on{display:block}

.box h2{color:var(--navy);margin-bottom:2px;font-size:1.2rem}

.opt{position:relative;border:1px solid #BFCAD9;border-radius:8px;padding:10px 12px;cursor:pointer;margin:0!important}
.opt input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;padding:0;border:0}

.opt:has(input:checked){border-color:var(--navy);background:#EEF2FA;box-shadow:inset 0 0 0 1px var(--navy)}

.drop{border:1px dashed #9AA8BE;border-radius:6px;padding:12px;text-align:center;color:var(--muted);cursor:pointer}
.drop.over{border-color:var(--amber);background:#FFFBEF}

.actrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}

.reply.t{border:2px solid var(--navy);border-radius:8px;padding:0 0 10px;margin:12px 0;background:#fff;overflow:hidden}
.reply.t>.meta{background:var(--navy);color:#fff;padding:8px 12px}
.reply.t .chip{background:var(--amber);color:var(--ink)}

.reply.t .body,.reply.t voice-player,.reply.t .actrow,.reply.t .pic{margin-inline:12px}

.reply.t.v{border-color:var(--ok)}.reply.t.v>.meta{background:var(--ok)}
.vote{display:inline-flex;align-items:center;gap:6px;font-size: 11px !important;border:1px solid var(--line);border-radius:6px;padding:3px 12px;font:inherit;font-weight:600;cursor:pointer;background:#fff;color:var(--navy)}
.vote.on{background:var(--teal);border-color:var(--teal);color:#fff}
.vr-row{display:flex;gap:10px;align-items:center}
.vr-time{font-weight:700;color:var(--red);font-variant-numeric:tabular-nums}
.vr-audio{width:100%;margin-top:10px}
.vr-err{color:var(--red);font-size:.88rem;}
.lock{background:#EEF1F6;border:1px solid var(--line);border-radius:6px;padding:10px 12px;color:var(--muted);margin-bottom:8px}
.hide{display:none!important}

<script type="module">
import { auth, db } from "./js/firebase.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { voiceRecorder } from "./js/voice.js";
import { collection, doc, getDoc, addDoc, updateDoc, deleteDoc, onSnapshot, query, orderBy, limit, where, serverTimestamp, arrayUnion, arrayRemove, increment } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const ADMIN_EMAIL = '01028604523@ahmed.app';
const CATS = ['النحو والصرف','الأدب والبلاغة','القراءة والنصوص'];
const MINE = 'أسئلتي';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let me = null, isAdmin = false, posts = [], tab = 'الكل', q = '', openId = null, unsubR = null, replies = [];
let nImg = '', rImg = '';
const nVoice = voiceRecorder($('nvoice'), { maxSec: 60, maxChars: 600000, btnClass: 'btn ghost', stopClass: 'btn red', label: 'سجّل سؤالك بصوتك' });
const rVoice = voiceRecorder($('rvoice'), { maxSec: 60, maxChars: 600000, btnClass: 'btn ghost', stopClass: 'btn red', label: 'رد بصوتك' });
const aud = (s, t) => (typeof s === 'string' && s.startsWith('data:audio/')) ? `<voice-player${t?' teacher':''} src="${esc(s)}"></voice-player>` : '';
// رد المدرس ظاهر للكل دايمًا
const canSee = () => true;
// لو صاحب السؤال اختار "المدرس بس": المدرس وصاحب السؤال (للتوضيح) بس هم اللي يردوا
const canReply = p => isAdmin || p.uid === me.uid || p.answerBy !== 'teacher';
const ICON = {'الكل':'','النحو والصرف':'','الأدب والبلاغة':'','القراءة والنصوص':''};
const COLS = ['#0E5C63','#17255E','#B26A00','#7A3E9D','#1B7F4B','#B3261E'];
const av = n => { const s=(n||'?').trim()||'?'; let h=0; for (const c of s) h=(h*31+c.charCodeAt(0))%COLS.length; return `<span class="av" style="background:${COLS[h]}">${esc(s.charAt(0))}</span>`; };


/* ---------- تطبيع النص العربي وتحليل الكلمات المفتاحية ---------- */
const norm = s => (s||'').replace(/[\u064B-\u065F\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').toLowerCase();
const STOP = new Set('في من على الى عن ما هو هي هل ايه ازاي يعني لو كده ده دي ان انا عايز عاوز كلمه جمله ممكن حد'.split(' '));
const toks = s => [...new Set(norm(s).split(/[^\u0621-\u064Aa-z0-9]+/).filter(w=>w.length>1&&!STOP.has(w)).map(w=>w.replace(/^ال/,'')))];
function similar(text){
  const a = toks(text); if (!a.length) return [];
  return posts.map(p => {
    const b = toks(p.title+' '+(p.lesson||'')+' '+(p.body||''));
    const k = a.filter(w=>b.includes(w)).length;
    const score = k / Math.min(a.length, b.length || 1) + (p.replyCount>0||p.hasVerified ? .15 : 0);
    return {p, k, score};
  }).filter(x => x.k >= 2 || (x.k >= 1 && a.length <= 2 && x.score >= .9)).sort((x,y)=>y.score-x.score).slice(0,3).map(x=>x.p);
}

/* ---------- الصور: ضغط + معاينة ---------- */
function compress(file){
  return new Promise((res, rej) => {
    if (!file || !file.type.startsWith('image/')) return rej(new Error('الملف لازم يكون صورة.'));
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const r = Math.min(1, 900 / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = img.width*r; c.height = img.height*r;
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', .72));
    };
    img.onerror = () => rej(new Error('مقدرتش أقرأ الصورة.'));
    img.src = url;
  });
}
function setPrev(pvId, imgId, src){ $(imgId).src = src || ''; $(pvId).classList.toggle('on', !!src); }
async function pick(file, errId, apply){
  try { const d = await compress(file); apply(d); $(errId).textContent=''; } catch(e){ $(errId).textContent = e.message; }
}
const drop = $('drop');
drop.onclick = () => $('nfile').click();
drop.onkeydown = e => { if (e.key==='Enter'||e.key===' ') { e.preventDefault(); $('nfile').click(); } };
['dragover','dragenter'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => pick(e.dataTransfer.files[0], 'nerr', d => { nImg = d; setPrev('pv','pvi',d); }));
$('nfile').onchange = e => pick(e.target.files[0], 'nerr', d => { nImg = d; setPrev('pv','pvi',d); e.target.value=''; });
$('pvx').onclick = () => { nImg=''; setPrev('pv','pvi',''); };
$('rimg').onclick = () => $('rfile').click();
$('rfile').onchange = e => pick(e.target.files[0], 'rerr', d => { rImg = d; setPrev('rpv','rpvi',d); e.target.value=''; });
$('rpvx').onclick = () => { rImg=''; setPrev('rpv','rpvi',''); };

/* ---------- العرض ---------- */
const fmt = t => t?.toDate ? t.toDate().toLocaleDateString('ar-EG',{day:'numeric',month:'long'}) : 'الآن';
function renderTabs(){
  $('tabs').innerHTML = ['الكل',...(isAdmin?[]:[MINE]),...CATS].map(t=>`<button class="tab ${t===tab?'on':''}" role="tab" aria-selected="${t===tab}" data-t="${esc(t)}">${ICON[t]||''} ${esc(t)}</button>`).join('');
}
let shown = 20, lastKey = '';
const tSubs = new Map(), tR = {};
function fillTR(id){
  const el = document.querySelector(`[data-tr="${id}"]`), p = posts.find(x=>x.id===id); if (!el || !p) return;
  let h = '', has = false;
  if (!p.teacherReplied) h = '<div class="trw">المدرس لسه مردّش على السؤال ده.</div>';
  else {
    const r = (tR[id]||[]).filter(x=>x.teacher).sort((a,b)=>(b.verified?1:0)-(a.verified?1:0)||(b.createdAt?.seconds||9e12)-(a.createdAt?.seconds||9e12))[0];
    if (r) { has = true; h = `<div class="trh">رد المدرس${r.verified?' <span class="chip ok">معتمد</span>':''}</div>${r.body?`<div class="trb">${esc(r.body)}</div>`:''}${aud(r.audio, true)}`; }
    else h = '<div class="trw">جاري تحميل رد المدرس...</div>';
  }
  el.className = 'tr' + (has ? ' has' : ''); el.innerHTML = h;
}
function syncSubs(ids){
  for (const [id,u] of tSubs) if (!ids.includes(id)) { u(); tSubs.delete(id); }
  ids.forEach(id => { if (tSubs.has(id)) return;
    tSubs.set(id, onSnapshot(query(collection(db,'forum_posts',id,'replies'), where('teacher','==',true)),
      s => { tR[id] = s.docs.map(d=>({id:d.id,...d.data()})); fillTR(id); },
      ex => { console.error(ex); tSubs.delete(id); }));
  });
}
function renderList(){
  $('sTot').textContent = posts.length; $('sOk').textContent = posts.filter(p=>p.hasVerified).length; $('sWait').textContent = posts.filter(p=>!p.teacherReplied).length;
  const mine = posts.filter(p=>p.uid===me.uid), mb = $('mineBar');
  mb.classList.toggle('hide', tab!==MINE);
  if (tab===MINE) mb.textContent = `أسئلتك: ${mine.length} — المدرس رد على ${mine.filter(p=>p.teacherReplied||p.hasVerified).length}، ولسه مردّش على ${mine.filter(p=>!p.teacherReplied&&!p.hasVerified).length}.`;
  const hot = Math.max(0, ...posts.map(p=>p.replyCount||0));
  const qt = toks(q);
  let L = posts.filter(p => (tab==='الكل' || (tab===MINE ? p.uid===me.uid : p.cat===tab)) && (!qt.length || qt.some(w => norm(p.title+' '+(p.lesson||'')+' '+(p.body||'')).includes(w))));
  L.sort((a,b)=> (b.pinned?1:0)-(a.pinned?1:0));
  $('more').classList.toggle('hide', L.length <= shown);
  L = L.slice(0, shown);
  // مفيش إعادة رسم لو مفيش تغيير، عشان التسجيل اللي شغال مايتقطعش
  const key = L.map(p=>[p.id,p.title,p.body,p.replyCount,p.pinned,p.hasVerified,p.teacherReplied,p.answerBy,p.replyVis,p.lesson].join('|')).join('~') + '#' + (L.length===0 ? tab+q : '');
  if (key === lastKey) return; lastKey = key;
  $('list').innerHTML = L.length ? L.map(p=>{
    const st = p.hasVerified ? ['ok','إجابة معتمدة'] : p.teacherReplied ? ['done','اتردّ عليه'] : ['wait','مستني المدرس'];
    return `
    <article class="card ${p.pinned?'pin':''}" data-id="${p.id}" tabindex="0">
      <div class="who">${av(p.name)}<div><b>${esc(p.name)}</b><small>${esc(p.grade||'')}${p.grade?' • ':''}${fmt(p.createdAt)}</small></div><span class="st ${st[0]}">${st[1]}</span></div>
      <h3>${esc(p.title)}</h3>
      <div class="meta" style="margin-top:6px">${p.pinned?'<span class="chip pin">مثبّت</span>':''}<span class="chip">${esc(p.cat)}</span>${p.lesson?`<span class="chip">${esc(p.lesson)}</span>`:''}${(p.replyCount||0)>=3&&p.replyCount===hot?'<span class="chip hot">الأكتر تفاعلًا</span>':''}</div>
      ${p.body?`<p style="margin-top:8px">${esc(p.body)}</p>`:''}
      ${p.image?`<img class="thumb" loading="lazy" src="${esc(p.image)}" alt="صورة السؤال">`:''}
      ${p.audio?`<div class="vl">تسجيل الطالب</div>${aud(p.audio)}`:''}
      <div class="tr" data-tr="${p.id}"></div>
      <div class="meta foot"><span>${p.replyCount||0} رد</span><span class="mode chip">${p.answerBy==='teacher'?'المدرس بس':'الطلبة والمدرس'}</span></div>
    </article>`;}).join('') : `<p class="empty">${tab===MINE?'لسه مسألتش أي سؤال.':'مفيش أسئلة هنا لسه. كن أول واحد يسأل!'}</p>`;
  syncSubs(L.filter(p=>p.teacherReplied && canSee(p)).map(p=>p.id));
  L.forEach(p => fillTR(p.id));
}
function renderHead(){
  const p = posts.find(x=>x.id===openId); if (!p) { $('head').innerHTML='<p class="empty">السؤال ده اتمسح.</p>'; return; }
  const can = isAdmin; // السؤال بعد النشر مايتعدّلش ولا يتمسح غير من المدرس
  $('head').innerHTML = `
    <div class="meta">${p.pinned?'<span class="chip pin">مثبّت</span>':''}<span class="chip">${esc(p.cat)}</span>${p.lesson?`<span class="chip">${esc(p.lesson)}</span>`:''}</div>
    <h2 style="margin-top:8px">${esc(p.title)}</h2>
    <div class="meta"><span>${esc(p.name)}${p.grade?' - '+esc(p.grade):''}</span><span>•</span><span>${fmt(p.createdAt)}</span></div>
    <div class="body">${esc(p.body)}</div>${aud(p.audio)}${p.image?`<img class="pic" src="${esc(p.image)}" alt="صورة السؤال">`:''}
    <div class="meta" style="margin-top:10px"><span class="chip">${p.answerBy==='teacher'?'المدرس بس هو اللي بيرد':'الطلبة والمدرس بيردوا'}</span></div>
    <div class="actrow">${isAdmin?`<button class="btn amber small" data-pin="${p.id}">${p.pinned?'إلغاء التثبيت':'تثبيت في القمة'}</button>`:''}${can?`<button class="btn red small" data-delp="${p.id}">مسح السؤال</button>`:''}</div>`;
  const rp = canReply(p); $('rf').classList.toggle('hide', !rp);
  $('rnote').classList.toggle('hide', rp); $('rnote').textContent = 'صاحب السؤال اختار إن المدرس بس هو اللي يرد على السؤال ده.';
}
function renderReplies(){
  const p = posts.find(x=>x.id===openId);
  const note = '';
  const R = [...replies].sort((a,b)=> (b.teacher?1:0)-(a.teacher?1:0) || (b.verified?1:0)-(a.verified?1:0) || (b.voters?.length||0)-(a.voters?.length||0) || (a.createdAt?.seconds||9e12)-(b.createdAt?.seconds||9e12));
  $('replies').innerHTML = note + (R.length ? R.map(r=>{
    const on = r.voters?.includes(me.uid);
    return `<div class="reply ${r.teacher?'t':''} ${r.verified?'v':''}">
      <div class="meta">${r.verified?'<span class="chip ok">إجابة معتمدة</span>':''}${r.teacher?'<span class="chip pin">المدرس</span>':'<span class="chip">طالب</span>'}<b>${esc(r.name)}</b><span>${fmt(r.createdAt)}</span></div>
      ${r.body?`<div class="body">${esc(r.body)}</div>`:''}${aud(r.audio, r.teacher)}${r.image?`<img class="pic" src="${esc(r.image)}" alt="صورة">`:''}
      <div class="actrow"><button class="vote ${on?'on':''}" data-vote="${r.id}">مفيد (${r.voters?.length||0})</button>
      ${isAdmin?`<button class="btn small ${r.verified?'ghost':'amber'}" data-ver="${r.id}">${r.verified?'إلغاء الاعتماد':'اعتماد كإجابة صحيحة'}</button>`:''}
      ${(isAdmin||r.uid===me.uid)?`<button class="btn red small" data-delr="${r.id}">مسح</button>`:''}</div></div>`;
  }).join('') : '<p class="empty">لسه مفيش ردود. ساعد زميلك!</p>');
}

/* ---------- فتح/غلق ---------- */
const open = id => $(id).classList.add('on'), close = id => $(id).classList.remove('on');
document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => { close(b.dataset.close); if (b.dataset.close==='ovDet') closeThread(); if (b.dataset.close==='ovNew') nVoice.reset(); });
function closeThread(){ unsubR?.(); unsubR=null; openId=null; replies=[]; subSee=null; rVoice.reset(); }
let subSee = null;
function subscribe(id){
  unsubR?.(); const p = posts.find(x=>x.id===id); subSee = p ? canSee(p) : false;
  const col = collection(db,'forum_posts',id,'replies');
  unsubR = onSnapshot(col,
    s => { replies = s.docs.map(d=>({id:d.id,...d.data()})); renderReplies(); },
    ex => { console.error(ex); $('replies').innerHTML = '<p class="empty">معرفتش أحمّل الردود.</p>'; });
}
function openThread(id){
  closeThread(); openId = id; renderHead(); $('replies').innerHTML=''; $('rf').reset(); rVoice.reset(); rImg=''; setPrev('rpv','rpvi','');
  subscribe(id); open('ovDet');
}

/* ---------- الأحداث ---------- */
$('tabs').onclick = e => { const t=e.target.closest('[data-t]'); if(t){ tab=t.dataset.t; shown=20; renderTabs(); renderList(); } };
$('search').oninput = e => { q = e.target.value; shown=20; renderList(); };
$('more').onclick = () => { shown += 20; renderList(); };
$('list').onclick = e => { if (e.target.closest('audio,voice-player')) return; const c=e.target.closest('[data-id]'); if(c) openThread(c.dataset.id); };
$('list').onkeydown = e => { if(e.key==='Enter' && !e.target.closest('audio,voice-player')){ const c=e.target.closest('[data-id]'); if(c) openThread(c.dataset.id); } };

$('newBtn').onclick = () => { $('nf').reset(); nVoice.reset(); nImg=''; setPrev('pv','pvi',''); $('sim').classList.remove('on'); $('nerr').textContent=''; if(CATS.includes(tab)) $('ncat').value=tab; open('ovNew'); $('nt').focus(); };
let tmr;
$('nt').oninput = () => { clearTimeout(tmr); tmr = setTimeout(() => {
  const s = similar($('nt').value);
  $('simList').innerHTML = s.map(p=>`<a data-sim="${p.id}">${p.hasVerified?'':''}${esc(p.title)} <small>(${p.replyCount||0})</small></a>`).join('');
  $('sim').classList.toggle('on', s.length>0);
}, 250); };
$('simList').onclick = e => { const a=e.target.closest('[data-sim]'); if(a){ close('ovNew'); openThread(a.dataset.sim); } };

$('nf').onsubmit = async e => {
  e.preventDefault(); if (nVoice.busy) { $('nerr').textContent='وقّف التسجيل الأول.'; return; }
  const b=$('nsend'); b.disabled=true; $('nerr').textContent='';
  try {
    await addDoc(collection(db,'forum_posts'), {
      uid: me.uid, name: me.name, grade: me.grade, title: $('nt').value.trim(), body: $('nb').value.trim(),
      cat: $('ncat').value, lesson: $('nl').value.trim(), image: nImg, audio: nVoice.value,
      answerBy: document.querySelector('input[name=rby]:checked').value,
      replyVis: 'public', pinned:false, hasVerified:false, replyCount:0, createdAt: serverTimestamp()
    });
    nVoice.reset(); close('ovNew');
  } catch(ex){ console.error(ex); $('nerr').textContent='معرفتش أنشر السؤال، جرّب تاني.'; }
  b.disabled=false;
};
$('rf').onsubmit = async e => {
  e.preventDefault(); const body=$('rb').value.trim();
  if (rVoice.busy) { $('rerr').textContent='وقّف التسجيل الأول.'; return; }
  if (!body && !rVoice.value && !(isAdmin && rImg)) { $('rerr').textContent='اكتب ردك أو سجّل ردّ صوتي.'; return; }
  const b=$('rsend'); b.disabled=true; $('rerr').textContent='';
  try {
    await addDoc(collection(db,'forum_posts',openId,'replies'), { uid:me.uid, name:me.name, teacher:isAdmin, body, audio:rVoice.value, image:isAdmin?rImg:'', voters:[], verified:false, createdAt:serverTimestamp() });
    await updateDoc(doc(db,'forum_posts',openId), { replyCount: increment(1), ...(isAdmin ? { teacherReplied:true } : {}) });
    $('rf').reset(); rVoice.reset(); rImg=''; setPrev('rpv','rpvi','');
  } catch(ex){ console.error(ex); $('rerr').textContent='معرفتش أبعت الرد، جرّب تاني.'; }
  b.disabled=false;
};
$('ovDet').onclick = async e => {
  const t = e.target.closest('button'); if(!t) return; const pid = openId;
  try {
    if (t.dataset.pin) { const p=posts.find(x=>x.id===pid); await updateDoc(doc(db,'forum_posts',pid), {pinned:!p.pinned}); }
    else if (t.dataset.delp) { if(isAdmin && confirm('تمسح السؤال ده؟')){ await deleteDoc(doc(db,'forum_posts',pid)); close('ovDet'); closeThread(); } }
    else if (t.dataset.vote) { const r=replies.find(x=>x.id===t.dataset.vote); const on=r.voters?.includes(me.uid);
      await updateDoc(doc(db,'forum_posts',pid,'replies',r.id), {voters: on?arrayRemove(me.uid):arrayUnion(me.uid)}); }
    else if (t.dataset.ver) { const r=replies.find(x=>x.id===t.dataset.ver); const v=!r.verified;
      await updateDoc(doc(db,'forum_posts',pid,'replies',r.id), {verified:v});
      await updateDoc(doc(db,'forum_posts',pid), {hasVerified: v || replies.some(x=>x.id!==r.id&&x.verified)}); }
    else if (t.dataset.delr) { if(confirm('تمسح الرد ده؟')){ const r=replies.find(x=>x.id===t.dataset.delr);
      await deleteDoc(doc(db,'forum_posts',pid,'replies',r.id)); await updateDoc(doc(db,'forum_posts',pid), {replyCount: increment(-1)}); } }
  } catch(ex){ console.error(ex); alert('العملية مانفعتش، جرّب تاني.'); }
};

/* ---------- البداية ---------- */
$('ncat').innerHTML = CATS.map(c=>`<option>${c}</option>`).join('');
onAuthStateChanged(auth, async user => {
  if (!user) { location.replace('login.html'); return; }
  isAdmin = (user.email||'').toLowerCase() === ADMIN_EMAIL;
  $('rimg').classList.toggle('hide', !isAdmin);
  let d = {}; try { const s = await getDoc(doc(db,'users',user.uid)); if (s.exists()) d = s.data(); } catch(_){}
  me = { uid:user.uid, name: d.student || (isAdmin ? 'أ. أحمد رمضان' : 'طالب'), grade: d.grade || '' };
  renderTabs();
  if (!isAdmin && !me.grade) { $('loading').textContent = 'حسابك مش متسجّل فيه الصف الدراسي. كلّم المدرس.'; return; }
  if (!isAdmin) document.querySelector('.head .sub').textContent = 'أسئلة ' + me.grade + ' بس. اسأل، جاوب زمايلك، وراجع المنهج.';
  // الطالب بيشوف أسئلة صفه بس (وقواعد Firestore بتفرض ده)، والمدرس بيشوف الكل
  const qy = isAdmin ? query(collection(db,'forum_posts'), orderBy('createdAt','desc'), limit(300))
                     : query(collection(db,'forum_posts'), where('grade','==',me.grade), limit(500));
  onSnapshot(qy, s => {
    posts = s.docs.map(x=>({id:x.id,...x.data()})).sort((a,b)=>(b.createdAt?.seconds||9e12)-(a.createdAt?.seconds||9e12));
    $('loading').classList.add('hide'); $('app').classList.remove('hide');
    renderList(); if (openId) { renderHead(); const p=posts.find(x=>x.id===openId); if (p && canSee(p)!==subSee) subscribe(openId); }
  }, ex => { console.error(ex); $('loading').textContent='معرفتش أحمّل المنتدى. تأكد من قواعد Firestore وحدّث الصفحة.'; });
});
</script>
</body>
